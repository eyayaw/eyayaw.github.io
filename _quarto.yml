project:
  type: website
  output-dir: _site
  preview:
    port: 4243
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
website:
  title: Eyayaw Beze
  description: "Eyayaw Beze's personal website"
  site-url: https://eyayaw.github.io/ #"{{< var site-url >}}"
  repo-url: https://github.com/eyayaw/eyayaw.github.io #"{{< var repo-url >}}"
  repo-actions: [source, edit, issue]
  twitter-card:
    title: Eyayaw
    creator: "@eyayaw"
    card-style: summary_large_image
    site: "@eyayaw"
  open-graph: true
  favicon: /img/favicon.jpg
  google-analytics: "G-0MBR68SHL8"
  navbar:
    title: eyayaw
    background: light
    left:
      - text: about
        href: about.qmd
      - text: research
        href: research.qmd
    right:
      - text: blog
        href: blog.qmd
      - text: my setup
        href: my-setup.qmd
      - icon: github
        href: "{{< var github >}}"
  page-footer:
    left: >-
      <span>© {{< var year >}} Eyayaw Beze | እያያው ተካ</span>
    center: >-
      [<i class="bi bi-github" aria-hidden="true"></i>]({{< var github >}}){aria-label="GitHub"}
      [<i class="bi bi-linkedin" aria-hidden="true"></i>]({{< var linkedin >}}){aria-label="LinkedIn"}
      [<i class="bi bi-twitter" aria-hidden="true"></i>]({{< var twitter >}}){aria-label="Twitter"}
      [<i class="bi bi-mastodon" aria-hidden="true"></i>]({{< var mastodon >}}){aria-label="Mastodon"}
      [<i class="bi bi-bluesky" aria-hidden="true"></i>]({{< var bluesky >}}){aria-label="Bluesky"}
    right: >-
      <span>Made with ❤️ + <a href="https://r-project.org" aria-label="R project"><img src="/img/icons/r.svg" alt="R" class="inline-icon"/></a> + <a href="https://quarto.org"><img src="/img/icons/quarto.png" alt="" width="16" height="16"/> Quarto</a></span>

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    include-in-header:
      - text: >-
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">

editor: source
